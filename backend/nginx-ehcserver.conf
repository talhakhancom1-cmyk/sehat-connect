server {
    server_name ehcserver.webfrat.com www.ehcserver.webfrat.com;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    root /opt/sehat-connect/dist;
    index index.html;
    location / { try_files $uri $uri/ /index.html; }

    # REST API
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Internal service-to-service API (DND + caller identity lookups from afridiwins)
    # Protected by INTERNAL_API_SECRET header, NOT user JWT auth.
    location /internal/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # WebSocket signaling
    location /ws/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # Health check
    location /health { proxy_pass http://127.0.0.1:3000/health; access_log off; }

    client_max_body_size 30m;

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    # ssl_certificate and ssl_certificate_key are managed by Certbot —
    # do NOT change these lines on the actual server.
    # ssl_certificate /etc/letsencrypt/live/ehcserver.webfrat.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/ehcserver.webfrat.com/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = www.ehcserver.webfrat.com) {
        return 301 https://$host$request_uri;
    }
    if ($host = ehcserver.webfrat.com) {
        return 301 https://$host$request_uri;
    }
    listen 80;
    listen [::]:80;
    server_name ehcserver.webfrat.com www.ehcserver.webfrat.com;
    return 404;
}
